name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # The main package.json uses workspace:* for Activepieces framework
      # deps, which only resolve inside the AP monorepo. CI runs the
      # standalone vitest suite that covers framework-free helpers
      # (custom-fields, signature) — that lives under tests/ with its
      # own package.json.
      - name: Install test deps
        working-directory: tests
        run: npm ci || npm install

      - name: Run tests
        working-directory: tests
        run: npm test
